add('X','M',`Considere la siguiente secuencia de igualdades:<p class="mth">N<sub>1</sub> = 3 &nbsp; N<sub>2</sub> = 3 &nbsp; N<sub>3</sub> = 6 &nbsp; N<sub>4</sub> = 6 &nbsp; N<sub>5</sub> = 9 &nbsp; N<sub>6</sub> = 9</p>Si se continúa la secuencia, ¿a cuánto equivale N<sub>85</sub>?`,
['126','129','132','255'],1,`Los términos van en parejas. La posición 85 pertenece a la pareja 43 (posiciones 85 y 86), y su valor es 3 · 43 = 129.`);
add('X','M',`En una galaxia hay dos planetas, X y Y. Cada año del planeta X dura 90 días terrestres y cada año del planeta Y dura 150 días terrestres.<br><br>¿Qué cantidad de años de X tiene un habitante que tiene 12 años de Y?`,
['7','12','18','20'],3,`12 años de Y son 12 · 150 = 1800 días terrestres. 1800 ÷ 90 = 20 años de X.`);
add('X','M',`Un entrenador tenía 20 000 colones para comprar balones y conos. Compró 3 balones para cada uno de sus 5 equipos. La cantidad de conos que compró fue el doble de la cantidad de balones. Cada balón le costó 900 colones y cada cono, 150 colones.<br><br>¿Cuál expresión permite obtener la cantidad de colones que le sobraron?`,
['20 000 − 15 · 900 − 30 · 150','20 000 − 30 · 900 − 15 · 150','20 000 − 15 · 900 + 30 · 150','20 000 − 8 · 900 − 16 · 150'],0,`Balones: 3 · 5 = 15, a 900 cada uno. Conos: 30, a 150 cada uno. Ambos gastos se restan del total.`);
add('X','M',`Una calculadora dañada triplica cada número que se ingresa antes de hacer la operación. Por ejemplo, al ingresar 2 + 5 calcula 6 + 15.<br><br>¿En cuál operación el resultado de la calculadora dañada es siempre 9 veces el resultado correcto?`,
['En la suma.','En la resta.','En la multiplicación.','En la división.'],2,`(3a) · (3b) = 9ab. En la suma y la resta el resultado se triplica, y en la división queda igual.`);
add('X','M',`En el país M una bicicleta cuesta 4000 soles. En el país N la misma bicicleta cuesta 9000 lunas. Se sabe que 3 lunas equivalen a 1 sol.<br><br>¿Cuánto dinero ahorra una persona del país M si compra la bicicleta en el país N?`,
['500 soles','1000 soles','3000 soles','5000 soles'],1,`9000 lunas ÷ 3 = 3000 soles. Ahorro: 4000 − 3000 = 1000 soles.`);
add('X','M',`Un club recibe cada mes dos grupos de socios nuevos: uno de 9 personas y otro de 5 personas. Los socios nuevos son distintos cada mes.<br><br>¿Cuál es el mínimo número de meses que debe transcurrir para que la cantidad total de socios nuevos sea divisible por 4?`,
['2','3','4','7'],0,`Cada mes entran 14 socios. 14 no es divisible por 4, pero 28 sí: bastan 2 meses.`);
add('X','M',`Camila reparte todo el contenido de una jarra llena de jugo en 3 vasos.<br><br>¿Cuál de las siguientes opciones es imposible que suceda?`,
['Los tres vasos reciben la misma cantidad de jugo.','Un vaso recibe la mitad del jugo, otro la tercera parte y otro la sexta parte.','Dos vasos reciben la cuarta parte del jugo cada uno y el otro recibe la mitad.','Un vaso recibe la mitad del jugo, otro la cuarta parte y otro la quinta parte.'],3,`1/2 + 1/4 + 1/5 = 19/20: no suma la jarra completa. Las otras tres reparticiones suman exactamente 1.`);
add('X','M',`Una hormiga camina 20 cm por minuto sobre una regla larga, sin detenerse. Parte de la marca P: primero camina 60 cm hacia la derecha, luego 100 cm hacia la izquierda y después 80 cm hacia la derecha.<br><br>¿Dónde está la hormiga 10 minutos después de haber salido?`,
['40 cm a la izquierda de P.','En la marca P.','20 cm a la derecha de P.','40 cm a la derecha de P.'],1,`En 10 minutos recorre 200 cm: 60 a la derecha, 100 a la izquierda y 40 del último tramo. 60 − 100 + 40 = 0.`);
add('X','M',`Un bus sale de la terminal con cierta cantidad de pasajeros. En la primera parada baja la tercera parte de los pasajeros y suben 4. En la segunda parada baja la mitad de los pasajeros que iban en ese momento y suben 3, con lo cual quedan 20 pasajeros.<br><br>¿Cuántos pasajeros salieron de la terminal?`,
['30','36','42','45'],3,`Hacia atrás: antes de subir 3 había 17, que era la mitad de 34. Antes de subir 4 había 30, que eran dos tercios de 45.`);
add('X','M',`Un medicamento se aplica cada 45 días. La primera dosis se aplicó un lunes.<br><br>¿Qué día de la semana se aplica la cuarta dosis?`,
['Lunes.','Martes.','Miércoles.','Jueves.'],2,`La cuarta dosis llega 3 · 45 = 135 días después. 135 = 7 · 19 + 2: dos días después del lunes.`);
add('X','M',`La nota final de un curso es exactamente el promedio de dos exámenes. Diana obtuvo en el segundo examen 12 puntos más que en el primero.<br><br>¿Cuál de las siguientes opciones se deduce, con certeza?`,
['La nota final es 6 puntos mayor que la del primer examen.','La nota final es mayor que la del segundo examen.','La nota final es 12 puntos mayor que la del primer examen.','La nota final es igual a la del primer examen.'],0,`El promedio de x y x + 12 es x + 6.`);
add('X','M',`Para numerar las páginas de un folleto, empezando con 1 en la primera página, se usaron 252 dígitos en total.<br><br>¿Cuántas páginas tiene el folleto?`,
['120','126','189','252'],0,`Páginas 1 a 9: 9 dígitos. Páginas 10 a 99: 180 dígitos. Quedan 63 dígitos, que alcanzan para 21 páginas de tres cifras: 99 + 21 = 120.`);
add('X','M',`Un reloj digital marca las 6:38.<br><br>¿Cuántos minutos faltan para la primera vez que la suma de los dígitos de la hora y los minutos sea 20?`,
['11','20','21','30'],2,`Con la hora 6, los minutos deben sumar 14: eso ocurre por primera vez a las 6:59, 21 minutos después.`);
add('X','M',`Se llama SD de un número entero positivo a la suma de sus dígitos; por ejemplo, SD(47) = 4 + 7 = 11. Considere que x es un número de dos dígitos y que z es un número de tres dígitos.<br><br>¿Cuál de las siguientes afirmaciones es imposible?`,
['SD(x) = 19','SD(x) = 18','SD(z) = 1','SD(x) = SD(z)'],0,`Con dos dígitos la suma máxima es 9 + 9 = 18. Las demás son posibles: 99, 100, y por ejemplo x = 11 con z = 110.`);
add('X','M',`En una campaña de lectura, por cada libro leído un estudiante gana 150 puntos, y por cada 400 puntos recibe una insignia. Al final del año, Pablo recibió exactamente 6 insignias y no le sobraron puntos.<br><br>¿Cuántos libros leyó Pablo?`,
['16','18','24','32'],0,`6 insignias son 2400 puntos. 2400 ÷ 150 = 16 libros.`);
add('X','M',`Irene no recuerda los dos últimos dígitos de un código. Lo que recuerda es que esos dos dígitos suman 9 y que el primero de ellos es mayor que el segundo.<br><br>¿Cuántas posibilidades tiene Irene para completar el código?`,
['4','5','9','10'],1,`Las parejas son 9-0, 8-1, 7-2, 6-3 y 5-4.`);
add('X','M',`Considere que a y b son números enteros positivos y que K = a · b + a.<br><br>¿Cuál de las siguientes afirmaciones, con certeza, es verdadera?`,
['Si a es impar, entonces K es impar.','Si b es impar, entonces K es par.','Si a y b son pares, entonces K es impar.','Si b es par, entonces K es par.'],1,`K = a · (b + 1). Si b es impar, b + 1 es par y el producto también.`);
add('X','M',`Un perro persigue a un conejo que está 12 metros adelante. El perro avanza 5 metros cada segundo y el conejo, 3 metros cada segundo. Ambos corren en la misma dirección.<br><br>¿Cuál es la distancia entre el perro y el conejo después de 4 segundos?`,
['0 metros','2 metros','3 metros','4 metros'],3,`El perro acorta 2 metros cada segundo: en 4 segundos acorta 8. Quedan 12 − 8 = 4 metros.`);

</script>
<script>
(function(){
'use strict';
var LIMIT = 146000;            // 2 min 26 s por ítem (1 h 50 min ÷ 45)
var TOTAL = 110 * 60000;       // 1 h 50 min
var AREA = { L: 'Lectura', G: 'Lógica', M: 'Matemática' };
var UNI = {
  ucr: { name: 'UCR', full: 'Universidad de Costa Rica', bank: 'P', mix: { L: 21, G: 12, M: 12 }, blurb: 'PAA: razonamiento en contextos verbales y matemáticos.' },
  una: { name: 'UNA', full: 'Universidad Nacional', bank: 'P', mix: { L: 21, G: 12, M: 12 }, blurb: 'Aplica la misma PAA que la UCR.' },
  tec: { name: 'TEC', full: 'Instituto Tecnológico de Costa Rica', bank: 'T', mix: { L: 17, G: 14, M: 14 }, blurb: 'PAA del TEC: razonamiento matemático y verbal.' }
};
var byId = {}; B.forEach(function (it) { byId[it.id] = it; });
var app = document.getElementById('app');
var PDF = 'impreso/cuadernillo-simulacro-admision.pdf';   // cuadernillo imprimible
function pdfLink(cls,txt){return '<a class="'+cls+'" href="'+PDF+'" download="cuadernillo-simulacro-admision.pdf" target="_blank" rel="noopener">'+txt+'</a>';}
var ADMIN = String(CONFIG.admin || '').trim().toLowerCase(), SYNC = String(CONFIG.sync || '').trim();
var S = { view: 'login', user: null, uni: 'ucr', mode: 'sim', area: 'all', exam: null, filter: 'all', ask: false };
var A = { rows: [], src: 'local', msg: '', sel: null };   // panel de administrador
var loginErr = '', syncing = false;
var enterAt = Date.now(), ticker = null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s;}
function fmtLong(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function pool(uni,a){var k=UNI[uni].bank;return B.filter(function(it){return (it.u===k||it.u==='X')&&it.a===a;});}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function recs(){var a=lsGet('paa-registros',[]);return Array.isArray(a)?a:[];}
function saveRecs(a){lsSet('paa-registros',a.slice(-500));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function isAdmin(){return !!S.user&&S.user.email===ADMIN;}
function pct(r){return Math.round(100*r.ok/r.n);}
function when(d){var t=new Date(d);return isNaN(t)?'':t.toLocaleString('es-CR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function plain(h){return String(h).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();}
/* Envía al registro central los intentos que aún no se han enviado. */
function sync(){
  if(!SYNC||syncing)return;
  var p=recs().filter(function(r){return !r.s;});if(!p.length)return;
  syncing=true;
  (function next(i){
    if(i>=p.length){syncing=false;return;}
    fetch(SYNC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',rec:p[i]})})
      .then(function(r){return r.json();})
      .then(function(j){if(j&&j.ok){var all=recs();all.forEach(function(r){if(r.id===p[i].id)r.s=1;});saveRecs(all);}next(i+1);})
      .catch(function(){syncing=false;});
  })(0);
}
function loadAdmin(){
  A.rows=recs();A.msg='';
  if(!SYNC){A.src='local';render();return;}
  var key=lsGet('paa-clave','');
  if(!key){A.src='needkey';render();return;}
  A.src='loading';render();
  fetch(SYNC+'?action=list&key='+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){A.src='needkey';A.msg='La clave no coincide con la del registro central.';lsSet('paa-clave','');}
    else{var seen={};A.rows=(j.rows||[]).concat(recs()).filter(function(r){if(!r||!r.id||seen[r.id])return false;seen[r.id]=1;return true;});A.src='central';}
    render();
  }).catch(function(){A.src='error';render();});
}
function csv(){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var out=[['fecha','correo','nombre','universidad','modo','correctas','total','porcentaje','segundos','items_en_rojo','sin_contestar'].join(',')];
  A.rows.forEach(function(r){out.push([q(r.d),q(r.email),q(r.name),q(r.uni),q(r.mode==='sim'?'simulacro':'practica'),r.ok,r.n,pct(r),Math.round(r.ms/1000),r.late,r.blank].join(','));});
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv'}));a.download='registros-simulacro.csv';document.body.appendChild(a);a.click();a.remove();}catch(e){}
}

/* Cuántas veces ha visto esta persona cada ítem y en qué intento lo vio por última vez. */
function seen(){
  var em=S.user?S.user.email:'',cnt={},last={};
  recs().filter(function(r){return r.email===em;}).sort(function(x,y){return x.d<y.d?-1:1;}).forEach(function(r,k){
    (r.items||[]).forEach(function(t){cnt[t[0]]=(cnt[t[0]]||0)+1;last[t[0]]=k;});});
  return {cnt:cnt,last:last};
}
/* Toma n ítems del grupo: primero los nunca vistos, luego los vistos hace más tiempo; al azar entre iguales. */
function pick(list,n,sn){
  return shuffle(list).sort(function(x,y){
    var a=sn.cnt[x.id]||0,b=sn.cnt[y.id]||0;if(a!==b)return a-b;
    return (sn.last[x.id]||0)-(sn.last[y.id]||0);
  }).slice(0,n).map(function(it){return it.id;});
}
function build(){
  var ids=[],sn=seen();
  if(S.mode==='sim'){
    var mix=UNI[S.uni].mix;
    ['L','G','M'].forEach(function(a){ids=ids.concat(pick(pool(S.uni,a),mix[a],sn));});
  }else{
    var areas=S.area==='all'?['L','G','M']:[S.area], per=S.area==='all'?5:15;
    areas.forEach(function(a){ids=ids.concat(pick(pool(S.uni,a),per,sn));});
  }
  ids=shuffle(ids);
  /* El orden de las opciones también cambia en cada intento: perm[i][posición] = opción original. */
  S.exam={uni:S.uni,mode:S.mode,ids:ids,ans:ids.map(function(){return -1;}),times:ids.map(function(){return 0;}),perm:ids.map(function(){return shuffle([0,1,2,3]);}),i:0,done:false};
  S.view='exam';S.ask=false;enterAt=Date.now();
}
function perm(i){var x=S.exam;return (x.perm&&x.perm[i])||[0,1,2,3];}
function letter(i,o){return o<0?'':'ABCD'[perm(i).indexOf(o)];}   // letra con la que se mostró la opción o en el ítem i
function frozen(i){var x=S.exam;return x.mode==='prac'&&x.ans[i]>=0;}
function commit(){var x=S.exam;if(!x||x.done)return;if(!frozen(x.i))x.times[x.i]+=Date.now()-enterAt;enterAt=Date.now();}
function curTime(){var x=S.exam;return x.times[x.i]+(frozen(x.i)?0:Date.now()-enterAt);}
function totTime(){var x=S.exam,t=0;for(var i=0;i<x.times.length;i++)t+=x.times[i];return t+(frozen(x.i)?0:Date.now()-enterAt);}
function goTo(i){var x=S.exam;if(i<0||i>=x.ids.length)return;commit();x.i=i;enterAt=Date.now();render();window.scrollTo(0,0);}
function finish(){
  commit();var x=S.exam;x.done=true;S.view='result';S.ask=false;S.filter='all';
  var r=summary();
  var all=recs();
  all.push({id:uid(),email:S.user.email,name:S.user.name||'',d:new Date().toISOString(),uni:x.uni,mode:x.mode,ok:r.ok,n:x.ids.length,ms:r.ms,late:r.late,blank:r.blank,areas:r.area,
    items:x.ids.map(function(id,i){return [id,x.ans[i],Math.round(x.times[i]/1000)];})});
  saveRecs(all);sync();
  render();window.scrollTo(0,0);
}
function summary(){
  var x=S.exam,r={ok:0,blank:0,ms:0,late:0,area:{L:[0,0,0],G:[0,0,0],M:[0,0,0]}};
  x.ids.forEach(function(id,i){var it=byId[id],a=r.area[it.a];a[1]++;a[2]+=x.times[i];r.ms+=x.times[i];
    if(x.ans[i]===it.k){r.ok++;a[0]++;}if(x.ans[i]<0)r.blank++;if(x.times[i]>LIMIT)r.late++;});
  return r;
}

/* ---------- vistas ---------- */
function vHome(){
  var h=recs().filter(function(r){return r.email===S.user.email;}).reverse().slice(0,8),u=UNI[S.uni];
  var unis=Object.keys(UNI).map(function(k){var v=UNI[k];return '<button class="pick" data-act="uni" data-v="'+k+'" aria-pressed="'+(S.uni===k)+'"><strong>'+v.name+'</strong><span>'+v.full+'. '+v.blurb+'</span></button>';}).join('');
  var mix=u.mix;
  var chips=[['all','Las tres áreas'],['L','Lectura'],['G','Lógica'],['M','Matemática']].map(function(c){return '<button class="chip" data-act="area" data-v="'+c[0]+'" aria-pressed="'+(S.area===c[0])+'">'+c[1]+'</button>';}).join('');
  var hist=h.length?h.map(function(r){var d=new Date(r.d);return '<li><span>'+UNI[r.uni].name+' · '+(r.mode==='sim'?'Simulacro':'Práctica')+' · '+d.toLocaleDateString('es-CR',{day:'numeric',month:'short'})+'</span><span class="num"><b>'+r.ok+'/'+r.n+'</b> · '+fmtLong(r.ms)+'</span></li>';}).join(''):'<li class="muted">Todavía no tiene intentos guardados en este dispositivo.</li>';
  return userbar()+'<header class="mast"><div><div class="eyebrow">Prueba de Aptitud Académica · Costa Rica</div><h1>Simulacro de admisión</h1></div><p>Practique con ítems de lectura, lógica y matemática, con el ritmo de tiempo del examen real.</p></header>'+
  '<div class="home"><main>'+
    '<section class="step"><h2><b>1</b>Elija la universidad</h2><div class="unis">'+unis+'</div></section>'+
    '<section class="step"><h2><b>2</b>Elija cómo practicar</h2><div class="modes">'+
      '<button class="pick" data-act="mode" data-v="sim" aria-pressed="'+(S.mode==='sim')+'"><em>Simulacro completo</em><span>45 ítems: '+mix.L+' de lectura, '+mix.G+' de lógica y '+mix.M+' de matemática. Las respuestas se revisan al final.</span></button>'+
      '<button class="pick" data-act="mode" data-v="prac" aria-pressed="'+(S.mode==='prac')+'"><em>Práctica corta</em><span>15 ítems. Al marcar una opción se muestra la respuesta correcta y la explicación.</span></button>'+
    '</div>'+(S.mode==='prac'?'<div class="chips" role="group" aria-label="Área de la práctica corta">'+chips+'</div>':'')+'</section>'+
    '<section class="step"><h2><b>3</b>Empiece</h2><div><button class="go" data-act="start">Empezar '+(S.mode==='sim'?'el simulacro':'la práctica')+' de la '+u.name+' →</button></div><p class="muted" style="margin:0;font-size:.9rem">El cronómetro arranca solo al abrir cada ítem. Tenga a mano lápiz y papel; no se usa calculadora.</p></section>'+
  '</main><aside>'+
    '<a class="panel book" href="'+PDF+'" download="cuadernillo-simulacro-admision.pdf" target="_blank" rel="noopener" aria-label="Descargar el cuadernillo de práctica en PDF">'+
      '<span class="eyebrow">Versión para imprimir · PDF</span><strong>Cuadernillo de práctica</strong>'+
      '<span>Las tres pruebas (UCR, UNA y TEC) con hoja de respuestas y solucionario.</span><em>↓ Tocar para descargar</em></a>'+
    '<div class="panel"><h3>Cómo funciona el cronómetro</h3><div class="clock-demo">'+
      '<div><span class="timer">1:48</span><span>Verde durante los primeros 2 min 26 s de cada ítem. Es el ritmo para terminar 45 ítems en 1 h 50 min.</span></div>'+
      '<div><span class="timer over">2:53</span><span>Rojo cuando se pasa de ese tiempo. Sigue contando hasta que usted pase al siguiente ítem.</span></div>'+
    '</div><p class="key">El tiempo de cada ítem queda registrado y aparece en los resultados.</p></div>'+
    '<div class="panel"><h3>Mis últimos intentos</h3><ul class="hist">'+hist+'</ul></div>'+
  '</aside></div>';
}

function userbar(){
  return '<div class="userbar"><span>Sesión: <b>'+esc(S.user.name||S.user.email)+'</b>'+(S.user.name?' · '+esc(S.user.email):'')+'</span>'+
    (isAdmin()?'<button class="link" data-act="admin">Panel de registros</button>':'')+'<button class="link" data-act="logout">Salir</button></div>';
}
function vLogin(){
  return '<header class="mast"><div><div class="eyebrow">Prueba de Aptitud Académica · Costa Rica</div><h1>Simulacro de admisión</h1></div><p>Práctica para el examen de admisión de la UCR, la UNA y el TEC.</p></header>'+
  '<form class="login panel" id="login" novalidate><h2 style="font-size:1.3rem">Ingrese con su correo</h2>'+
    '<label class="field" for="f-email">Correo electrónico<input id="f-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="nombre@correo.com"></label>'+
    '<label class="field" for="f-name">Nombre <small>(opcional, para identificar sus intentos)</small><input id="f-name" type="text" autocomplete="name"></label>'+
    (loginErr?'<p class="err">'+loginErr+'</p>':'')+
    '<button class="go" type="submit">Entrar →</button>'+
    '<p class="muted" style="margin:0;font-size:.88rem">No se necesita contraseña. Sus intentos quedan registrados con este correo para dar seguimiento a su avance.</p></form>'+
    '<p style="text-align:center;margin-top:18px">'+pdfLink('ghost dl','Descargar la versión para imprimir (PDF)')+'</p>';
}
function people(){
  var m={},out=[];
  A.rows.forEach(function(r){var k=String(r.email||'').toLowerCase();if(!k)return;(m[k]=m[k]||[]).push(r);});
  Object.keys(m).forEach(function(k){var a=m[k].sort(function(x,y){return x.d<y.d?-1:1;}),sum=0,best=0,ms=0,n=0,name='';
    a.forEach(function(r){var p=pct(r);sum+=p;if(p>best)best=p;ms+=r.ms;n+=r.n;if(r.name)name=r.name;});
    out.push({email:k,name:name,list:a,avg:Math.round(sum/a.length),best:best,per:ms/n,last:a[a.length-1]});});
  return out.sort(function(x,y){return x.last.d<y.last.d?1:-1;});
}
function adminStatus(){
  if(A.src==='central')return '<div class="status">Registro central conectado. Se muestran los intentos de todos los dispositivos.</div>';
  if(A.src==='loading')return '<div class="status">Consultando el registro central…</div>';
  if(A.src==='error')return '<div class="status warn">No se pudo consultar el registro central. Revise la conexión a internet y pulse Actualizar. Mientras tanto se muestran los intentos de este dispositivo.</div>';
  if(A.src==='needkey')return '<div class="status warn"><span>'+(A.msg||'Escriba la clave de administrador del registro central.')+'</span><input id="f-key" type="password" aria-label="Clave de administrador" placeholder="Clave de administrador"><button class="ghost" data-act="key">Conectar</button></div>';
  return '<div class="status warn">Registro local: solo aparecen los intentos hechos en este dispositivo. Para ver los de otros dispositivos hay que conectar el registro central (vea el archivo de instrucciones).</div>';
}
function spark(list){
  var W=560,H=150,n=list.length,pts=list.map(function(r,i){return [40+(n>1?i*(W-60)/(n-1):(W-60)/2),20+(100-pct(r))*1.1];});
  var grid=[0,50,100].map(function(v){var y=20+(100-v)*1.1;return '<line x1="40" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="34" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';}).join('');
  var dots=pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===n-1?6:3.5)+'" fill="var(--blue)"/>';}).join('');
  var last=pts[n-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Porcentaje de aciertos en cada intento">'+grid+
    '<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>'+dots+
    '<text x="'+Math.min(last[0],W-30)+'" y="'+(last[1]-12)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">'+pct(list[n-1])+' %</text></svg>';
}
/* Lectura sencilla del avance de una persona. Reglas fijas (no es una evaluación oficial):
   nivel general 80/65/50 %, por área fuerte >= 75 %, aceptable 55-74 %, debe mejorar < 55 %. */
var LV=[[80,4,'Muy buen nivel'],[65,3,'Buen nivel'],[50,2,'Nivel intermedio'],[0,1,'Nivel bajo']];
function yJoin(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
function level(v){for(var i=0;i<LV.length;i++)if(v>=LV[i][0])return {n:LV[i][1],t:LV[i][2]};}
function diagnose(p){
  var rec=p.list.slice(-3),ok=0,n=0,ms=0,blank=0,ar={L:[0,0,0],G:[0,0,0],M:[0,0,0]};
  rec.forEach(function(r){ok+=r.ok;n+=r.n;ms+=r.ms;blank+=r.blank||0;
    if(r.areas)['L','G','M'].forEach(function(a){var v=r.areas[a]||[0,0,0];ar[a][0]+=v[0];ar[a][1]+=v[1];ar[a][2]+=v[2];});});
  var g=n?Math.round(100*ok/n):0,lv=level(g),per=n?ms/n:0,strong=[],mid=[],weak=[],pts=[];
  ['L','G','M'].forEach(function(a){var v=ar[a];if(!v[1])return;var q=Math.round(100*v[0]/v[1]),e={a:a,name:AREA[a].toLowerCase(),q:q};
    (q>=75?strong:q>=55?mid:weak).push(e);});
  weak.sort(function(x,y){return x.q-y.q;});
  var list=function(a){return yJoin(a.map(function(e){return e.name+' ('+e.q+' %)';}));};
  var head=[ '', 'Le está costando: necesita estudiar más.', 'Va a medio camino: hay que reforzar varias cosas.', 'Va bien, con espacio para mejorar.', 'Va muy bien: tiene buena preparación para la prueba.'][lv.n];
  var sub='Acierta '+g+' de cada 100 ítems en '+(rec.length>1?'sus últimos '+rec.length+' intentos':'su único intento')+'.';
  if(strong.length)pts.push('Es fuerte en '+list(strong)+'.');
  if(mid.length)pts.push('Va aceptable en '+list(mid)+'; todavía puede subir.');
  if(weak.length)pts.push('Tiene que mejorar en '+list(weak)+'.');
  if(p.list.length>=2){var f=pct(p.list[0]),l=pct(p.list[p.list.length-1]),d=l-f;
    if(d>=5)pts.push('Viene mejorando: pasó de '+f+' % en el primer intento a '+l+' % en el último.');
    else if(d<=-5)pts.push('Ha bajado: pasó de '+f+' % en el primer intento a '+l+' % en el último. Conviene preguntarle qué pasó.');
    else pts.push('Se mantiene parecido entre intentos (de '+f+' % a '+l+' %).');}
  var slow=per>LIMIT,rush=per<40000&&g<65;
  if(slow)pts.push('Le falta ritmo: tarda '+fmt(per)+' por ítem y la meta es '+fmt(LIMIT)+'. Con ese ritmo no terminaría la prueba a tiempo.');
  else if(rush)pts.push('Contesta muy rápido ('+fmt(per)+' por ítem) y falla bastante: parece que no está leyendo con calma.');
  else if(n)pts.push('Maneja bien el tiempo: '+fmt(per)+' por ítem (la meta es '+fmt(LIMIT)+').');
  if(n&&blank/n>=0.1)pts.push('Deja ítems en blanco ('+blank+' de '+n+'). Conviene que conteste todos, aunque tenga dudas.');
  var todo=[];
  if(weak.length)todo.push('haga prácticas cortas de '+yJoin(weak.map(function(e){return e.name;}))+' y lea la explicación de cada ítem que falle');
  else if(mid.length)todo.push('siga practicando '+yJoin(mid.map(function(e){return e.name;}))+' para pasar de aceptable a fuerte');
  if(slow)todo.push('practique con el cronómetro a la vista para ganar ritmo');
  if(rush)todo.push('lea cada enunciado completo antes de marcar');
  if(n&&blank/n>=0.1)todo.push('no deje ítems sin contestar');
  if(!todo.length)todo.push('mantenga el ritmo con un simulacro completo cada semana');
  var line=[];
  if(strong.length)line.push('Fuerte en '+yJoin(strong.map(function(e){return e.name;})));
  if(weak.length)line.push('Debe mejorar en '+yJoin(weak.map(function(e){return e.name;})));
  if(!line.length&&mid.length)line.push('Aceptable en '+yJoin(mid.map(function(e){return e.name;})));
  if(slow)line.push('Le falta ritmo');
  return {g:g,lv:lv,head:head,sub:sub,pts:pts,todo:'Qué indicarle: que '+todo.join('; que ')+'.',line:line.join(' · '),
    few:p.list.length<3?'Con '+(p.list.length===1?'un solo intento':'solo '+p.list.length+' intentos')+' esto es una primera impresión; se vuelve más confiable con más intentos.':''};
}
function vDiag(p){var d=diagnose(p);
  return '<section class="diag l'+d.lv.n+'"><span class="lvl l'+d.lv.n+'">'+d.lv.t+'</span><h2 style="margin-top:8px">'+d.head+'</h2><p>'+d.sub+'</p>'+
    '<ul>'+d.pts.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul><p class="todo"><b>'+d.todo+'</b></p>'+
    (d.few?'<p class="muted" style="font-size:.88rem">'+d.few+'</p>':'')+
    '<p class="muted" style="font-size:.8rem;margin-bottom:0">Resumen automático con reglas fijas; sirve para orientar, no es una evaluación oficial.</p></section>';
}
function vPerson(p){
  var ar={L:[0,0,0],G:[0,0,0],M:[0,0,0]};
  p.list.forEach(function(r){if(r.areas)['L','G','M'].forEach(function(a){var v=r.areas[a]||[0,0,0];ar[a][0]+=v[0];ar[a][1]+=v[1];ar[a][2]+=v[2];});});
  var areas=['L','G','M'].filter(function(a){return ar[a][1];}).map(function(a){var v=ar[a];
    return '<div class="area"><b>'+AREA[a]+'</b><div class="track"><i style="width:'+(100*v[0]/v[1])+'%"></i></div><span class="num">'+v[0]+' de '+v[1]+' · '+fmt(v[2]/v[1])+' por ítem</span></div>';}).join('');
  var tries=p.list.slice().reverse().map(function(r){
    var miss=(r.items||[]).filter(function(t){var it=byId[t[0]];return it&&t[1]!==it.k;}).map(function(t){var it=byId[t[0]],tx=plain(it.q);
      return '<li><b>'+AREA[it.a]+'.</b> '+esc(tx.length>130?tx.slice(0,130)+'…':tx)+'<br><span class="muted">'+(t[1]<0?'Sin contestar':'Marcó “'+esc(plain(it.o[t[1]]))+'”')+' · correcta: “'+esc(plain(it.o[it.k]))+'” · '+fmt(t[2]*1000)+(t[2]*1000>LIMIT?' (en rojo)':'')+'</span></li>';}).join('');
    return '<details class="rev"><summary><b>'+pct(r)+'%</b><span class="ar muted">'+UNI[r.uni].name+'</span><span>'+when(r.d)+' · '+(r.mode==='sim'?'Simulacro':'Práctica')+' · '+r.ok+' de '+r.n+' · '+r.late+' en rojo</span><span class="timer sm off">'+fmtLong(r.ms)+'</span></summary>'+
      '<div class="body"><p class="eyebrow" style="margin:12px 0 8px">Ítems para repasar</p>'+(miss?'<ul class="miss">'+miss+'</ul>':'<p class="muted" style="margin:0">Acertó todos los ítems de este intento.</p>')+'</div></details>';
  }).join('');
  return '<div class="tools" style="margin-top:0"><button class="ghost" data-act="adm-back">← Todas las personas</button></div>'+
    '<section class="score" style="padding-top:8px"><div><div class="eyebrow">Avance de</div><h2 style="font-size:1.6rem;overflow-wrap:anywhere">'+esc(p.name||p.email)+'</h2>'+(p.name?'<div class="muted" style="overflow-wrap:anywhere">'+esc(p.email)+'</div>':'')+'</div><div class="facts">'+
      '<div class="fact"><b>'+p.list.length+'</b><span>intentos</span></div><div class="fact"><b>'+p.avg+' %</b><span>promedio de aciertos</span></div>'+
      '<div class="fact"><b>'+p.best+' %</b><span>mejor intento</span></div><div class="fact"><b>'+fmt(p.per)+'</b><span>promedio por ítem (meta: 2:26)</span></div></div></section>'+
    vDiag(p)+
    '<div class="tools"><h2>Aciertos por intento</h2></div>'+spark(p.list)+
    '<div class="tools"><h2>Aciertos por área</h2></div><section class="areas" style="margin-top:0">'+areas+'</section>'+
    '<details class="more"><summary>Ver el detalle de cada intento</summary>'+tries+'</details>';
}
function vAdmin(){
  var ps=people(),sel=A.sel&&ps.filter(function(p){return p.email===A.sel;})[0];
  var head='<div class="userbar"><span>Administrador: <b>'+esc(S.user.email)+'</b></span><button class="link" data-act="home">Hacer un simulacro</button><button class="link" data-act="logout">Salir</button></div>'+
    '<header class="mast"><div><div class="eyebrow">Simulacro de admisión</div><h1>Panel de registros</h1></div><div class="chips"><button class="ghost" data-act="adm-refresh">Actualizar</button><button class="ghost" data-act="csv"'+(A.rows.length?'':' disabled')+'>Descargar CSV</button>'+pdfLink('ghost dl','Cuadernillo PDF')+'</div></header>'+adminStatus();
  if(sel)return head+vPerson(sel);
  var tot=A.rows.length,avg=tot?Math.round(A.rows.reduce(function(s,r){return s+pct(r);},0)/tot):0;
  var rows=ps.map(function(p){return '<button class="prow" data-act="person" data-v="'+esc(p.email)+'"><span><strong>'+esc(p.name||p.email)+'</strong>'+(p.name?'<small>'+esc(p.email)+'</small>':'')+
    (function(){var d=diagnose(p);return '<span class="lvl l'+d.lv.n+'">'+d.lv.t+'</span>'+(d.line?'<span class="line">'+d.line+'</span>':'');})()+'</span>'+
    '<span class="num"><b>Intentos: </b>'+p.list.length+'</span><span class="num"><b>Promedio: </b>'+p.avg+' %</span><span class="num"><b>Mejor: </b>'+p.best+' %</span><span><b>Último: </b>'+when(p.last.d)+'</span></button>';}).join('');
  return head+'<section class="score" style="grid-template-columns:1fr"><div class="facts"><div class="fact"><b>'+ps.length+'</b><span>personas con intentos</span></div><div class="fact"><b>'+tot+'</b><span>intentos registrados</span></div><div class="fact"><b>'+avg+' %</b><span>promedio general de aciertos</span></div></div></section>'+
    '<div class="tools"><h2>Personas</h2></div>'+
    (rows?'<div class="people"><div class="prow head"><span>Persona</span><span>Intentos</span><span>Promedio</span><span>Mejor</span><span>Último intento</span></div>'+rows+'</div>':'<p class="empty">Todavía no hay intentos registrados. Aparecerán aquí cuando alguien termine un simulacro o una práctica.</p>');
}

function sheet(){
  var x=S.exam,done=x.ans.filter(function(a){return a>=0;}).length;
  var rows=x.ids.map(function(id,i){
    var b='',pm=perm(i);for(var o=0;o<4;o++)b+='<i'+(x.ans[i]===pm[o]?' class="on"':'')+'></i>';
    return '<button class="row'+(i===x.i?' cur':'')+(x.times[i]>LIMIT?' late':'')+'" data-act="jump" data-v="'+i+'" aria-label="Ir al ítem '+(i+1)+(x.ans[i]>=0?', contestado':', sin contestar')+'"><b>'+(i+1)+'</b>'+b+'</button>';
  }).join('');
  var open=window.matchMedia('(min-width:901px)').matches?' open':'';
  return '<details class="sheet"'+open+'><summary>Hoja para respuestas <span>'+done+' de '+x.ids.length+' contestados</span></summary>'+
    '<div class="rows'+(x.ids.length<=16?' short':'')+'">'+rows+'</div>'+
    '<p class="key">Toque un número para ir a ese ítem. El número se pone rojo si el ítem pasó de 2:26.</p>'+
    '<button class="ghost end" data-act="ask">Terminar y ver resultados</button></details>';
}

function vExam(){
  var x=S.exam,it=byId[x.ids[x.i]],n=x.ids.length,sel=x.ans[x.i],show=x.mode==='prac'&&sel>=0;
  var opts=perm(x.i).map(function(o,d){
    var t=it.o[o],c='opt';
    if(show){if(o===it.k)c+=' right';else if(o===sel)c+=' wrong';}else if(o===sel)c+=' sel';
    return '<button class="'+c+'" data-act="ans" data-v="'+o+'"'+(show?' disabled':'')+' aria-pressed="'+(o===sel)+'"><span class="bub">'+'ABCD'[d]+'</span><span>'+t+'</span></button>';
  }).join('');
  var why=show?'<div class="why'+(sel===it.k?'':' bad')+'"><b>'+(sel===it.k?'Correcto. ':'La respuesta correcta es la '+letter(x.i,it.k)+'. ')+'</b>'+it.e+'</div>':'';
  return '<div class="bar"><div class="where"><div class="eyebrow">'+UNI[x.uni].name+' · '+(x.mode==='sim'?'Simulacro':'Práctica corta')+' · '+AREA[it.a]+'</div><strong>Ítem '+(x.i+1)+' <span class="muted" style="font-weight:500">de '+n+'</span></strong></div>'+
    '<span class="tot" id="tot"></span><span class="timer" id="clk" role="timer" aria-label="Tiempo en este ítem">0:00</span>'+
    '<div class="fill" id="fill"><i></i></div></div>'+
  '<div class="exam"><main><p class="hint" id="hint" hidden>Pasó de 2:26 en este ítem. Marque su mejor opción y avance.</p>'+
    '<article class="q"><div class="stem">'+it.q+'</div><div class="opts">'+opts+'</div>'+why+
    (it.s==='tec'?'<p class="src">Fuente: Cuaderno de ejercicios PAA-TEC, 2.ª ed. (2023), CC BY-NC-SA 4.0.</p>':'')+'</article>'+
    '<div class="nav"><button class="ghost" data-act="prev"'+(x.i===0?' disabled':'')+'>← Anterior</button>'+
    (x.i<n-1?'<button class="go" data-act="next">Siguiente ítem →</button>':'<button class="go" data-act="ask">Terminar y ver resultados</button>')+'</div>'+
  '</main>'+sheet()+'</div>'+(S.ask?dialog():'');
}
function dialog(){
  var x=S.exam,blank=x.ans.filter(function(a){return a<0;}).length;
  return '<div class="veil"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt">¿Terminar ahora?</h3><p>'+
    (blank?'Le quedan <b>'+blank+'</b> ítems sin contestar. En el examen real conviene marcar siempre una opción.':'Contestó todos los ítems.')+
    '</p><div><button class="ghost" data-act="cancel">Seguir contestando</button><button class="go" data-act="finish">Ver resultados</button></div></div></div>';
}

function vResult(){
  var x=S.exam,r=summary(),n=x.ids.length,pct=Math.round(100*r.ok/n);
  var areas=['L','G','M'].filter(function(a){return r.area[a][1];}).map(function(a){var v=r.area[a];
    return '<div class="area"><b>'+AREA[a]+'</b><div class="track"><i style="width:'+(100*v[0]/v[1])+'%"></i></div><span class="num">'+v[0]+' de '+v[1]+' · '+fmt(v[2]/v[1])+' por ítem</span></div>';}).join('');
  var list=x.ids.map(function(id,i){
    var it=byId[id],a=x.ans[i],ok=a===it.k,late=x.times[i]>LIMIT;
    if(S.filter==='bad'&&ok)return '';if(S.filter==='late'&&!late)return '';
    var opts=perm(i).map(function(o,d){var t=it.o[o],c='opt';if(o===it.k)c+=' right';else if(o===a)c+=' wrong';
      return '<div class="'+c+'"><span class="bub">'+'ABCD'[d]+'</span><span>'+t+'</span></div>';}).join('');
    return '<details class="rev"><summary><b>'+(i+1)+'</b><span class="ar muted">'+AREA[it.a]+'</span><span>'+
      (a<0?'<span class="tag nil">Sin contestar</span>':ok?'<span class="tag ok">Correcto · '+letter(i,a)+'</span>':'<span class="tag no">Marcó '+letter(i,a)+' · era '+letter(i,it.k)+'</span>')+
      '</span><span class="timer sm'+(late?' over':'')+'">'+fmt(x.times[i])+'</span></summary>'+
      '<div class="body"><div class="stem">'+it.q+'</div><div class="opts">'+opts+'</div><div class="why'+(ok?'':' bad')+'"><b>Explicación. </b>'+it.e+'</div></div></details>';
  }).join('');
  var f=[['all','Todos'],['bad','Para repasar'],['late','En rojo']].map(function(c){return '<button class="chip" data-act="filter" data-v="'+c[0]+'" aria-pressed="'+(S.filter===c[0])+'">'+c[1]+'</button>';}).join('');
  return '<header class="mast"><div><div class="eyebrow">'+UNI[x.uni].name+' · '+(x.mode==='sim'?'Simulacro completo':'Práctica corta')+'</div><h1>Resultados</h1></div></header>'+
  '<section class="score"><div class="big">'+r.ok+'<small> / '+n+'</small></div><div class="facts">'+
    '<div class="fact"><b>'+pct+' %</b><span>de respuestas correctas</span></div>'+
    '<div class="fact"><b>'+fmtLong(r.ms)+'</b><span>tiempo total'+(x.mode==='sim'?' (meta: 1:50:00)':'')+'</span></div>'+
    '<div class="fact"><b>'+fmt(r.ms/n)+'</b><span>promedio por ítem (meta: 2:26)</span></div>'+
    '<div class="fact"><b>'+r.late+'</b><span>ítems en rojo</span></div>'+
    '<div class="fact"><b>'+r.blank+'</b><span>sin contestar</span></div>'+
  '</div></section>'+
  '<section class="areas">'+areas+'</section>'+
  '<div class="tools"><h2>Revisión ítem por ítem</h2>'+f+'</div>'+
  (list||'<p class="empty">No hay ítems en este filtro.</p>')+
  '<div class="actions"><button class="go" data-act="again">Hacer otro intento →</button><button class="ghost" data-act="home">Volver al inicio</button></div>';
}

function tick(){
  if(S.view!=='exam')return;
  var c=document.getElementById('clk');if(!c)return;
  var t=curTime(),late=t>LIMIT,tot=totTime(),x=S.exam;
  c.textContent=fmt(t);c.className='timer'+(frozen(x.i)?' off':late?' over':'');
  var f=document.getElementById('fill');f.className='fill'+(late?' over':'');f.firstChild.style.width=Math.min(100,100*t/LIMIT)+'%';
  document.getElementById('hint').hidden=!late||frozen(x.i);
  var e=document.getElementById('tot');
  e.textContent='Total '+fmtLong(tot)+(x.mode==='sim'?' de 1:50:00':'');e.className='tot'+(x.mode==='sim'&&tot>TOTAL?' over':'');
}
function render(){
  if(!S.user)S.view='login';
  app.innerHTML=S.view==='login'?vLogin():S.view==='admin'?vAdmin():S.view==='exam'?vExam():S.view==='result'?vResult():vHome();
  if(ticker){clearInterval(ticker);ticker=null;}
  if(S.view==='exam'){tick();ticker=setInterval(tick,250);}
}

app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),x=S.exam;
  if(a==='uni'){S.uni=v;render();}
  else if(a==='mode'){S.mode=v;render();}
  else if(a==='area'){S.area=v;render();}
  else if(a==='start'||a==='again'){if(a==='again'){S.uni=x.uni;S.mode=x.mode;}build();render();window.scrollTo(0,0);}
  else if(a==='ans'){var o=+v;if(x.mode==='prac'){if(x.ans[x.i]<0){commit();x.ans[x.i]=o;}}else{x.ans[x.i]=x.ans[x.i]===o?-1:o;}render();}
  else if(a==='next')goTo(x.i+1);
  else if(a==='prev')goTo(x.i-1);
  else if(a==='jump')goTo(+v);
  else if(a==='ask'){S.ask=true;render();}
  else if(a==='cancel'){S.ask=false;render();}
  else if(a==='finish')finish();
  else if(a==='filter'){S.filter=v;render();}
  else if(a==='home'){S.view='home';S.exam=null;render();window.scrollTo(0,0);}
  else if(a==='logout'){S.user=null;S.exam=null;S.view='login';lsSet('paa-sesion',null);render();}
  else if(a==='admin'||a==='adm-refresh'){if(!isAdmin())return;S.view='admin';if(a==='admin')A.sel=null;loadAdmin();}
  else if(a==='person'){A.sel=v;render();window.scrollTo(0,0);}
  else if(a==='adm-back'){A.sel=null;render();}
  else if(a==='csv')csv();
  else if(a==='key'){var k=document.getElementById('f-key');if(k&&k.value.trim()){lsSet('paa-clave',k.value.trim());loadAdmin();}}
});
app.addEventListener('submit',function(ev){
  ev.preventDefault();if(ev.target.id!=='login')return;
  var em=document.getElementById('f-email').value.trim().toLowerCase(),nm=document.getElementById('f-name').value.trim().slice(0,60);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){loginErr='Escriba un correo válido, por ejemplo nombre@correo.com.';render();var f=document.getElementById('f-email');f.value=em;f.focus();return;}
  loginErr='';S.user={email:em,name:nm};lsSet('paa-sesion',S.user);
  if(isAdmin()){S.view='admin';A.sel=null;loadAdmin();}else{S.view='home';render();}
  sync();
});
document.addEventListener('keydown',function(ev){
  if(S.view!=='exam'||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var x=S.exam,k=ev.key.toLowerCase();
  if(S.ask){if(k==='escape'){S.ask=false;render();}return;}
  var o='abcd'.indexOf(k);if(o<0)o='1234'.indexOf(k);
  if(o>=0&&k.length===1){var btn=app.querySelectorAll('.q .opt')[o];if(btn)btn.click();}
  else if(k==='arrowright')goTo(x.i+1);
  else if(k==='arrowleft')goTo(x.i-1);
});

function start(saved){
  if(saved&&saved.view){S=saved;if(S.exam&&!S.exam.ids.every(function(id){return byId[id];})){S.exam=null;S.view='home';}}
  if(!S.user){var u=lsGet('paa-sesion',null);if(u&&u.email)S.user=u;}
  if(!S.user)S.view='login';else if(S.view==='login'||!S.view)S.view=isAdmin()?'admin':'home';
  enterAt=Date.now();
  if(S.view==='admin')loadAdmin();else render();
  sync();
}
window.addEventListener('online',sync);
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){if(S.exam&&!S.exam.done)commit();return S;});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
</body>
